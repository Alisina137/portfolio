name: Portfolio verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Content, SEO, tests, and Next.js build
        env:
          PORTFOLIO_LAUNCH_APPROVED: 'false'
        run: |
          npm run verify
          npm run smoke:http
          npm run check:launch
